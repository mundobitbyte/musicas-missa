<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#243F62">
  <meta name="description" content="Acompanhe, compartilhe, imprima ou use em modo celebração o roteiro musical da Missa.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icone-app.svg" type="image/svg+xml">
  <title>Roteiro da Missa</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tema.css">
  <link rel="stylesheet" href="assets/css/print.css" media="print">
</head>
<body>
  <header class="topo somente-tela">
    <div class="container">
      <a class="marca" href="index.html">Músicas para a Missa</a>
      <nav>
        <a href="repertorio.html">Repertório</a>
        <a href="montar-missa.html">Editar Missa</a>
      </nav>
    </div>
  </header>

  <main class="container roteiro-container">
    <section class="cabecalho-pagina">
      <p class="sobrelinha">Roteiro</p>
      <h1>Missa preparada</h1>
      <div id="identificacaoRoteiro" class="identificacao-roteiro oculto"></div>
      <p class="somente-tela">Abra uma música ou ative o modo celebração para navegar uma a uma.</p>
      <p id="resumoRoteiro" class="resumo-roteiro"></p>
    </section>

    <div id="roteiro" class="roteiro"></div>

    <div class="barra-acoes somente-tela">
      <a class="botao" href="montar-missa.html">Editar escolhas</a>
      <button id="compartilharRoteiro" class="botao" type="button" disabled>Compartilhar roteiro</button>
      <button id="imprimir" class="botao" type="button">Imprimir</button>
      <button id="modoCelebracao" class="botao primario" type="button">Modo celebração</button>
    </div>
    <p id="statusCompartilhamento" class="status-compartilhamento somente-tela" role="status" aria-live="polite"></p>
  </main>

  <div id="celebracao" class="celebracao oculto somente-tela" role="dialog" aria-modal="true" aria-label="Modo celebração">
    <div class="celebracao-topo">
      <button id="sairCelebracao" class="fechar-celebracao" type="button">Sair</button>
      <div class="celebracao-controles" aria-label="Controles de leitura">
        <div class="controle-segmentado controle-celebracao-modo">
          <button id="celebracaoCifra" class="ativo" type="button">Letra e cifra</button>
          <button id="celebracaoLetra" type="button">Somente letra</button>
        </div>
        <div class="controle-fonte controle-celebracao-fonte" aria-label="Tamanho do texto">
          <button id="celebracaoMenor" type="button" aria-label="Diminuir texto">A−</button>
          <button id="celebracaoNormal" type="button" aria-label="Tamanho normal">A</button>
          <button id="celebracaoMaior" type="button" aria-label="Aumentar texto">A+</button>
        </div>
      </div>
    </div>

    <div class="celebracao-conteudo">
      <p id="celebracaoIdentificacao" class="celebracao-identificacao oculto"></p>
      <p id="celebracaoMomento" class="sobrelinha"></p>
      <h1 id="celebracaoTitulo"></h1>
      <p id="celebracaoMeta" class="celebracao-meta"></p>
      <pre id="celebracaoTexto" class="texto-celebracao"></pre>
    </div>

    <div class="celebracao-nav">
      <button id="anterior" type="button">← Anterior</button>
      <span id="posicaoCelebracao"></span>
      <button id="proxima" type="button">Próxima →</button>
    </div>
  </div>

  <script src="assets/js/site.js"></script>
  <script src="assets/js/missa.js"></script>
  <script src="assets/js/compartilhar.js"></script>
</body>
</html>
