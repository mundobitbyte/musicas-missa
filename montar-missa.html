<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#243F62">
  <meta name="description" content="Monte o repertório da Missa escolhendo uma música para cada momento da celebração.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icone-app.svg" type="image/svg+xml">
  <title>Montar Missa</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/tema.css">
</head>
<body>
  <header class="topo">
    <div class="container">
      <a class="marca" href="index.html">Músicas para a Missa</a>
      <nav>
        <a href="repertorio.html">Repertório</a>
        <a class="ativo" href="montar-missa.html">Montar Missa</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="cabecalho-pagina">
      <p class="sobrelinha">Preparação</p>
      <h1>Montar uma Missa</h1>
      <p>Escolha uma música para cada momento. Você pode deixar algum momento sem música.</p>
    </section>

    <section class="dados-celebracao" aria-labelledby="tituloDadosCelebracao">
      <div class="dados-celebracao-cabecalho">
        <div>
          <p class="sobrelinha">Identificação</p>
          <h2 id="tituloDadosCelebracao">Dados da celebração</h2>
        </div>
        <span>Opcional</span>
      </div>

      <div class="dados-celebracao-campos">
        <label>
          <span>Nome ou ocasião</span>
          <input id="celebracaoNome" type="text" maxlength="80" placeholder="Ex.: 26º Domingo do Tempo Comum">
        </label>

        <label>
          <span>Data</span>
          <input id="celebracaoData" type="date">
        </label>

        <label>
          <span>Horário</span>
          <input id="celebracaoHorario" type="time">
        </label>
      </div>
    </section>

    <div class="resumo-montagem" aria-live="polite">
      <strong id="resumoEscolhas">0 de 11 momentos com música</strong>
      <span>As escolhas ficam salvas neste aparelho.</span>
    </div>

    <div id="momentosMissa" class="lista-momentos"></div>

    <div class="barra-acoes">
      <button id="limpar" class="botao" type="button">Limpar músicas</button>
      <button class="botao" type="button" data-nova-missa>Nova Missa</button>
      <a id="gerarRoteiro" class="botao primario" href="roteiro.html">Gerar roteiro</a>
    </div>
  </main>

  <script src="assets/js/site.js"></script>
  <script src="assets/js/missa.js"></script>
  <script src="assets/js/nova-missa.js"></script>
</body>
</html>
